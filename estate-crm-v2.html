<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian Estates — Group CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1F19; --forest:#14513C; --forest-2:#1C6A4F; --brass:#B98527; --brass-soft:#F3E8CF;
  --lime:#EDF1EA; --paper:#FCFDFB; --stone:#6B7A72; --line:#D8E0D6;
  --hot:#AE3E2B; --hot-soft:#F8E7E3; --sky:#2E5E7E; --sky-soft:#E2ECF2;
  --display:'Archivo',system-ui,sans-serif; --body:'Karla',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  --r:5px; --accent:var(--forest);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--lime);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--stone)}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.rail{width:222px;flex:0 0 222px;background:var(--forest);color:#E7EFE9;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand-mark{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:-.02em;color:#fff;display:flex;align-items:center;gap:8px}
.plot{width:20px;height:20px;border:1.5px solid var(--brass);border-radius:2px;display:grid;place-items:center;font-family:var(--mono);font-size:9px;color:var(--brass);font-weight:600;flex:0 0 auto}
.brand-sub{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#8FB3A2;margin-top:5px}
.nav{padding:10px;display:flex;flex-direction:column;gap:1px;flex:1;overflow:auto}
.nav .grp{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#6E9384;padding:14px 10px 6px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#C6D8CD;padding:8px 10px;border-radius:var(--r);font-size:13.5px;font-weight:500;transition:background .12s,color .12s}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:var(--ink);color:#fff}
.nav button.on .ico{color:var(--brass)}
.ico{width:15px;text-align:center;font-size:12px;color:#7FA694;flex:0 0 auto}
.nav .count{margin-left:auto;font-family:var(--mono);font-size:10px;color:#8FB3A2}
.nav .count.alert{background:var(--hot);color:#fff;padding:1px 5px;border-radius:8px;font-weight:600}
.rail-foot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:10px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--brass);color:var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:11.5px;flex:0 0 auto}
.rail-foot .who{font-size:12.5px;font-weight:600;color:#fff;line-height:1.2}
.rail-foot .role{font-family:var(--mono);font-size:9px;color:#8FB3A2;letter-spacing:.08em;text-transform:uppercase}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--paper);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent)}
.topbar h1{font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:-.02em;margin:0}
.topbar .sub{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--stone);margin-top:2px}

/* role switcher — signature control */
.roles{display:flex;background:var(--lime);border:1px solid var(--line);border-radius:var(--r);padding:2px;gap:2px;margin-left:auto}
.roles button{border:0;background:none;padding:6px 12px;border-radius:3px;font-size:12px;font-weight:600;color:var(--stone);display:flex;align-items:center;gap:6px;transition:background .14s,color .14s}
.roles button:hover{color:var(--ink)}
.roles button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(14,31,25,.12)}
.roles button i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.4;display:block}
.roles button.on i{opacity:1}
.roles button:nth-child(1).on i{background:var(--brass)}
.roles button:nth-child(2).on i{background:var(--sky)}
.roles button:nth-child(3).on i{background:var(--forest)}
.search{position:relative}
.search input{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px 8px 29px;width:190px;background:var(--paper)}
.search::before{content:"⌕";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--stone);font-size:15px}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:8px 13px;border-radius:var(--r);font-weight:600;font-size:13px;transition:background .12s,border-color .12s}
.btn:hover{background:var(--forest);border-color:var(--forest)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--lime);color:var(--ink)}
.btn.brass{background:var(--brass);border-color:var(--brass);color:var(--ink)}
.btn.brass:hover{background:#A57518;border-color:#A57518;color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{background:transparent;color:var(--hot);border-color:#E5C6BF}
.btn.danger:hover{background:var(--hot-soft)}
.view{padding:20px 22px 40px;flex:1;animation:up .26s ease both}
@keyframes up{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ---------- primitives ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}
.sec-head{display:flex;align-items:baseline;gap:10px;margin:0 0 14px}
.sec-head h2{font-family:var(--display);font-size:14px;font-weight:700;letter-spacing:-.01em;margin:0}
.sec-head .note{font-size:12px;color:var(--stone);margin-left:auto}
.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:2px;background:var(--lime);color:var(--forest);border:1px solid var(--line);white-space:nowrap}
.tag.hot{background:var(--hot-soft);color:var(--hot);border-color:#EBC9C1}
.tag.warm{background:var(--brass-soft);color:#7A5A12;border-color:#E2D2AE}
.tag.sky{background:var(--sky-soft);color:var(--sky);border-color:#CBDCE7}
.tag.sold{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.grid2e{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}

/* ---------- kpis ---------- */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.kpi{padding:13px 14px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.kpi .v{font-family:var(--display);font-size:23px;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin:6px 0 2px}
.kpi .d{font-size:11.5px;color:var(--stone)}
.kpi .d b{color:var(--forest);font-weight:600}
.kpi .d b.dn{color:var(--hot)}

/* ---------- charts ---------- */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .lbl{font-family:var(--mono);font-size:9.5px;fill:var(--stone)}
.chart .val{font-family:var(--mono);font-size:10px;fill:var(--ink);font-weight:500}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--stone)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:2px;display:block}

/* ---------- bar rows ---------- */
.brow{display:grid;grid-template-columns:118px 1fr 96px;align-items:center;gap:10px;padding:7px 0}
.brow .bl{font-size:12.5px;font-weight:600}
.bbar{height:20px;background:var(--lime);border-radius:2px;overflow:hidden;position:relative}
.bbar i{display:block;height:100%;background:var(--forest);border-radius:2px;transition:width .6s cubic-bezier(.3,1,.4,1)}
.bbar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.brow .bv{text-align:right;font-family:var(--mono);font-size:12px;font-weight:500}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;background:var(--paper)}
.tbl th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--stone);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
.tbl tbody tr{transition:background .1s}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover{background:var(--lime)}
.tbl .nm{font-weight:600}
.mini{height:6px;background:var(--lime);border-radius:3px;overflow:hidden;min-width:70px}
.mini i{display:block;height:100%;background:var(--forest)}
.mini i.over{background:var(--brass)}
.mini i.under{background:var(--hot)}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;background:var(--paper)}

/* ---------- pipeline ---------- */
.board{display:grid;grid-template-columns:repeat(5,minmax(196px,1fr));gap:11px;align-items:start}
.col{background:rgba(255,255,255,.5);border:1px solid var(--line);border-radius:var(--r);min-height:160px;display:flex;flex-direction:column}
.col.over{border-color:var(--brass);background:var(--brass-soft)}
.col-head{padding:10px 11px;border-bottom:1px solid var(--line);background:var(--paper);border-radius:var(--r) var(--r) 0 0}
.col-head .n{display:flex;align-items:center;gap:7px;font-family:var(--display);font-size:12px;font-weight:700}
.col-head .n b{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--stone);background:var(--lime);padding:1px 5px;border-radius:2px}
.col-head .val{font-family:var(--mono);font-size:11px;color:var(--forest);margin-top:3px;font-weight:500}
.col-body{padding:8px;display:flex;flex-direction:column;gap:8px;flex:1}
.lead{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px;cursor:grab;transition:box-shadow .12s,border-color .12s;position:relative}
.lead:hover{box-shadow:0 1px 9px rgba(14,31,25,.1);border-color:#BFCCBB}
.lead.drag{opacity:.4}
.lead .nm{font-weight:700;font-size:13px;letter-spacing:-.01em;padding-right:42px}
.lead .ref{position:absolute;top:9px;right:10px;font-family:var(--mono);font-size:9px;color:var(--stone)}
.lead .req{font-size:11.5px;color:var(--stone);margin-top:1px}
.lead .bud{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--forest);margin-top:6px}
.lead .foot{display:flex;align-items:center;gap:5px;margin-top:8px;flex-wrap:wrap}
.lead .ag{margin-left:auto;width:20px;height:20px;border-radius:50%;background:var(--lime);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:9px;font-weight:600;color:var(--forest)}

/* ---------- queue / approvals / tasks ---------- */
.qitem{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);margin-bottom:9px}
.qitem .body{min-width:0;flex:1}
.qitem .t{font-weight:600;font-size:13.5px}
.qitem .s{font-size:12px;color:var(--stone);margin-top:1px}
.qitem .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stampcol{width:4px;align-self:stretch;border-radius:2px;background:var(--brass);flex:0 0 auto}
.stampcol.sky{background:var(--sky)} .stampcol.hot{background:var(--hot)} .stampcol.done{background:var(--line)}
.task{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}
.task:last-child{border-bottom:0}
.task input{margin-top:3px;accent-color:var(--forest);width:15px;height:15px}
.task.done .t{text-decoration:line-through;color:var(--stone)}
.task .t{font-size:13px;font-weight:600}
.task .s{font-size:11.5px;color:var(--stone)}
.task .when{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--stone);white-space:nowrap}

.visit{display:flex;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line);align-items:center}
.visit:last-child{border-bottom:0}
.visit .time{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--forest);width:52px;flex:0 0 auto}
.visit .who{font-weight:600;font-size:13px}
.visit .where{font-size:11.5px;color:var(--stone)}

/* ---------- people ---------- */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.person{padding:14px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
.person .hd{display:flex;gap:10px;align-items:center}
.person .nm{font-family:var(--display);font-weight:700;font-size:14px}
.person .rl{font-size:11.5px;color:var(--stone)}
.person dl{display:grid;grid-template-columns:1fr auto;gap:4px 8px;margin:12px 0 0;font-size:12px}
.person dt{color:var(--stone)} .person dd{margin:0;font-family:var(--mono);font-weight:500}

/* ---------- properties ---------- */
.props{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:13px}
.prop{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .12s}
.prop:hover{box-shadow:0 1px 10px rgba(14,31,25,.1)}
.prop .img{height:98px;background:var(--forest);position:relative;display:grid;place-items:center}
.prop .img .glyph{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;color:rgba(255,255,255,.45);text-transform:uppercase}
.prop .img .st{position:absolute;top:8px;left:8px}
.prop .img .age{position:absolute;bottom:8px;right:8px;font-family:var(--mono);font-size:9px;color:rgba(255,255,255,.6)}
.prop .bd{padding:11px;flex:1;display:flex;flex-direction:column}
.prop .t{font-family:var(--display);font-weight:700;font-size:13px}
.prop .loc{font-size:11.5px;color:var(--stone)}
.prop .pr{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--forest);margin-top:7px}
.prop .meta{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.prop .row{display:flex;align-items:center;gap:8px;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--stone)}

/* ---------- drawer / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(14,31,25,.34);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(465px,100%);background:var(--paper);z-index:50;transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;border-left:1px solid var(--line)}
.drawer.on{transform:none}
.dr-head{padding:16px 20px;border-bottom:1px solid var(--line);background:var(--forest);color:#fff;position:relative}
.dr-head .x{position:absolute;top:12px;right:14px;background:none;border:0;color:rgba(255,255,255,.7);font-size:20px;line-height:1}
.dr-head .x:hover{color:#fff}
.dr-head h3{font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:-.02em;margin:6px 0 3px}
.dr-head .meta{font-family:var(--mono);font-size:11px;color:#A9C7B7}
.dr-body{padding:18px 20px;overflow:auto;flex:1}
.dr-sec{margin-bottom:20px}
.dr-sec h4{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--stone);font-weight:500;margin:0 0 9px}
.kv{display:grid;grid-template-columns:98px 1fr;gap:5px 10px;font-size:13px}
.kv dt{color:var(--stone);font-size:12px} .kv dd{margin:0;font-weight:500}
.stage-pick{display:flex;gap:5px;flex-wrap:wrap}
.stage-pick button{border:1px solid var(--line);background:var(--paper);padding:6px 9px;border-radius:2px;font-size:11.5px;font-weight:600;color:var(--stone)}
.stage-pick button.on{background:var(--forest);border-color:var(--forest);color:#fff}
.stage-pick button:disabled{opacity:.45;cursor:not-allowed}
.match{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.match:last-child{border-bottom:0}
.match .sq{width:34px;height:34px;background:var(--forest);border-radius:2px;flex:0 0 auto;display:grid;place-items:center;color:var(--brass);font-family:var(--mono);font-size:9px}
.match .t{font-weight:600;font-size:12.5px} .match .s{font-size:11px;color:var(--stone)}
.match .p{margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--forest)}
.logbox{display:flex;gap:8px}
.logbox input{flex:1;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--paper)}
.tl{border-left:2px solid var(--line);padding-left:14px;margin-left:4px}
.tl .e{position:relative;padding:0 0 13px}
.tl .e:last-child{padding-bottom:0}
.tl .e::before{content:"";position:absolute;left:-19px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--brass);border:2px solid var(--paper)}
.tl .e .txt{font-size:12.5px} .tl .e .w{font-family:var(--mono);font-size:10px;color:var(--stone);margin-top:1px}
.locked{background:var(--lime);border:1px dashed var(--line);border-radius:var(--r);padding:11px 12px;font-size:12px;color:var(--stone)}
.locked b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px;font-size:12.5px}

.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-46%);width:min(470px,92vw);z-index:60;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;max-height:88vh;display:flex;flex-direction:column}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal h3{font-family:var(--display);font-size:16px;font-weight:700;margin:0;padding:15px 18px;border-bottom:1px solid var(--line)}
.modal .b{padding:16px 18px;display:grid;gap:11px;overflow:auto}
.modal .f{display:grid;gap:4px}
.modal label{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--stone)}
.modal input,.modal select{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--paper);width:100%}
.modal .ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}

/* ---------- website ---------- */
.site-wrap{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.site-bar{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--lime);border-bottom:1px solid var(--line)}
.site-bar .dots{display:flex;gap:5px}
.site-bar .dots i{width:9px;height:9px;border-radius:50%;background:#C4CFC1;display:block}
.site-bar .url{font-family:var(--mono);font-size:11px;color:var(--stone);background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:3px 12px}
.site-bar .hint{margin-left:auto;font-size:11.5px;color:var(--stone)}
.hero{background:var(--forest);color:#fff;padding:50px 40px 44px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:34px 34px}
.hero .in{position:relative;max-width:640px}
.hero .eyebrow{color:var(--brass)}
.hero h2{font-family:var(--display);font-size:38px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:12px 0}
.hero p{font-size:15px;color:#BFD5C8;max-width:440px;margin:0 0 20px}

function barChart(data,w=520,h=190){
  const pad={l:34,r:8,t:14,b:26}, iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const max=Math.max(...data.map(d=>Math.max(d.booked,d.target)))*1.12;
  const bw=iw/data.length, bar=Math.min(30,bw*0.42);
  let g='';
  for(let i=0;i<=4;i++){const y=pad.t+ih-(ih/4)*i;g+=`<line class="gl" x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}"/><text class="lbl" x="${pad.l-6}" y="${y+3}" text-anchor="end">${Math.round(max/4*i)}</text>`}
  data.forEach((d,i)=>{
    const cx=pad.l+bw*i+bw/2;
    const bh=(d.booked/max)*ih, th=(d.target/max)*ih;
    g+=`<rect x="${cx-bar-1}" y="${pad.t+ih-bh}" width="${bar}" height="${bh}" fill="var(--forest)" rx="2"><animate attributeName="height" from="0" to="${bh}" dur="0.6s" fill="freeze"/><animate attributeName="y" from="${pad.t+ih}" to="${pad.t+ih-bh}" dur="0.6s" fill="freeze"/></rect>`;
    g+=`<rect x="${cx+1}" y="${pad.t+ih-th}" width="${bar}" height="${th}" fill="var(--lime)" stroke="var(--line)" rx="2"/>`;
    g+=`<text class="lbl" x="${cx}" y="${h-8}" text-anchor="middle">${d.q}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Quarterly bookings against target, in crore">${g}</svg>
  <div class="legend"><span><i style="background:var(--forest)"></i>Booked (₹ Cr)</span><span><i style="background:var(--lime);border:1px solid var(--line)"></i>Target</span></div>`;
}
function donut(segs,size=150){
  const r=size/2-14, cx=size/2, cy=size/2, C=2*Math.PI*r;
  const total=segs.reduce((s,x)=>s+x.v,0)||1; let off=0;
  const rings=segs.map(s=>{
    const len=(s.v/total)*C, el=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.c}" stroke-width="16" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"/>`;
    off+=len; return el;
  }).join('');
  return `<svg class="chart" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Inventory age distribution">

function wireDnd(){
  let dragId=null;
  document.querySelectorAll('.lead').forEach(el=>{
    el.addEventListener('dragstart',e=>{dragId=el.dataset.id;el.classList.add('drag');e.dataTransfer.effectAllowed='move'});
    el.addEventListener('dragend',()=>{el.classList.remove('drag');document.querySelectorAll('.col').forEach(c=>c.classList.remove('over'))});
  });
  document.querySelectorAll('.col').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('over')});
    col.addEventListener('dragleave',()=>col.classList.remove('over'));
    col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('over');if(dragId)moveLead(dragId,col.dataset.stage)});
  });
}
function moveLead(id,stage){
  const l=leads.find(x=>x.id===id); if(!l||l.stage===stage)return;
  if(stage==='won'&&role==='agent'){
    const ap=approvals.find(a=>a.leadId===id&&a.status==='pending');
    if(ap){toast('Closing is blocked — <b>'+ap.id+'</b> is still with your manager');return}
  }
  l.stage=stage; l.log.unshift({t:`Stage changed to ${stageLabel(stage)}`,w:'just now'});
  activity.push({t:`${l.name} → ${stageLabel(stage)}`,w:'now'});
  renderNav(); render(); toast(`<b>${esc(l.name)}</b> → ${stageLabel(stage)}`);
}

  return `<div style="max-width:820px">

function decide(id,status){
  const a=approvals.find(x=>x.id===id); a.status=status; a.w='just now';
  const l=leads.find(x=>x.id===a.leadId);
  if(l){l.log.unshift({t:`Discount ${status} by ${nameOf(me)} — ${money(a.offer)}`,w:'just now'});
    l.next=status==='approved'?'Confirm price with buyer':'Renegotiate — discount refused';}
  activity.push({t:`${a.id} ${status} by ${nameOf(me)}`,w:'now'});
  renderNav(); render();
  toast(status==='approved'?`<b>${a.id}</b> approved — ${nameOf(a.agent)} notified`:`<b>${a.id}</b> rejected — agent asked to renegotiate`);
}

  const showAgent=role!=='agent';
  return `<div class="filters">
    <select onchange="leadFilter.stage=this.value;render()"><option value="">All stages</option>${STAGES.map(s=>`<option value="${s.id}" ${leadFilter.stage===s.id?'selected':''}>${s.label}</option>`).join('')}</select>
    ${showAgent?`<select onchange="leadFilter.agent=this.value;render()"><option value="">All agents</option>${AGENT_IDS.map(k=>`<option value="${k}" ${leadFilter.agent===k?'selected':''}>${PEOPLE[k].name}</option>`).join('')}</select>`:''}
    <span style="font-size:12px;color:var(--stone)">${arr.length} of ${set.length}</span>
  </div>
  <div class="card" style="overflow:auto">
  ${arr.length?`<table class="tbl">
    <thead><tr><th>Ref</th><th>Name</th><th>Requirement</th><th>Budget</th><th>Stage</th><th>Source</th>${showAgent?'<th>Owner</th>':''}<th>Next action</th></tr></thead>
    <tbody>${arr.map(l=>`<tr class="click" onclick="openLead('${l.id}')">
      <td class="mono" style="font-size:11px;color:var(--stone)">${l.id}</td>
      <td class="nm">${esc(l.name)}${l.temp==='hot'?' <span class="tag hot" style="margin-left:4px">hot</span>':''}</td>
      <td>${l.bhk?l.bhk+' BHK':'Plot'} · ${esc(l.loc)}</td>
      <td class="mono">${money(l.budget)}</td>
      <td><span class="tag">${stageLabel(l.stage)}</span></td>
      <td style="color:var(--stone)">${esc(l.source)}</td>
      ${showAgent?`<td>${l.agent?nameOf(l.agent).split(' ')[0]:'<span class="tag hot">unassigned</span>'}</td>`:''}
      <td style="color:var(--stone);font-size:12px">${esc(l.next)}</td></tr>`).join('')}</tbody></table>`
  :`<div class="empty"><b>No leads match those filters</b>Clear a filter, or add a lead to get started.</div>`}</div>`;
}

/* ---------- shared: properties ---------- */
function vProps(){
  let arr=properties.filter(p=>{
    if(propFilter.loc&&p.loc!==propFilter.loc)return false;
    if(propFilter.type&&p.type!==propFilter.type)return false;
    if(propFilter.status&&p.status!==propFilter.status)return false;
    if(searchTerm&&!(p.title+p.loc+p.id).toLowerCase().includes(searchTerm))return false;
    return true;
  });
  return `<div class="filters">
    <select onchange="propFilter.loc=this.value;render()"><option value="">All localities</option>${LOCALITIES.map(l=>`<option ${propFilter.loc===l?'selected':''}>${l}</option>`).join('')}</select>
    <select onchange="propFilter.type=this.value;render()"><option value="">All types</option>${['Apartment','Villa','Plot'].map(t=>`<option ${propFilter.type===t?'selected':''}>${t}</option>`).join('')}</select>
    <select onchange="propFilter.status=this.value;render()"><option value="">Any status</option>${['Available','Reserved','Sold'].map(s=>`<option ${propFilter.status===s?'selected':''}>${s}</option>`).join('')}</select>
    <span style="font-size:12px;color:var(--stone)">${arr.length} listings</span>
  </div>
  ${arr.length?`<div class="props">${arr.map(p=>`
    <article class="prop">
      <div class="img"><span class="glyph">${p.id} · ${p.facing} facing</span>
        <span class="st tag ${p.status==='Sold'?'sold':p.status==='Reserved'?'warm':''}">${p.status}</span>
        <span class="age">${p.days}d listed</span></div>
      <div class="bd">
        <div class="t">${esc(p.title)}</div><div class="loc">${esc(p.loc)}</div>
        <div class="pr mono">${money(p.price)}</div>
        <div class="meta"><span class="tag">${p.bhk?p.bhk+' BHK':'Plot'}</span><span class="tag">${p.sqft} sqft</span><span class="tag">${p.type}</span></div>
        <div class="row"><span>${nameOf(p.agent).split(' ')[0]}</span>
        <button class="btn ghost sm" style="margin-left:auto" onclick="matchBuyers('${p.id}')">Matching buyers</button></div>
      </div></article>`).join('')}</div>`
  :`<div class="card empty"><b>Nothing in inventory matches</b>Try widening the locality or status filter.</div>`}`;
}
function matchBuyers(pid){
  const p=properties.find(x=>x.id===pid);
  const pool=role==='agent'?myLeads():leads;
  const m=pool.filter(l=>l.stage!=='won'&&l.budget>=p.price*0.85&&l.budget<=p.price*1.25&&(l.loc===p.loc||l.bhk===p.bhk));
  toast(m.length?`<b>${m.length}</b> buyer(s) match ${esc(p.title)}: ${m.map(l=>esc(l.name)).join(', ')}`:`No matching buyers for ${esc(p.title)}`);
}

function vVisits(){
  const arr=role==='agent'?visits.filter(v=>v.agent===me):visits;
  return `<div class="card pad" style="max-width:720px">
    <div class="sec-head"><h2>Scheduled viewings</h2><span class="note">Sunday, 24 August</span></div>
    ${arr.map(v=>`<div class="visit">
      <div class="time">${v.time}</div>
      <div><div class="who">${esc(v.who)}</div><div class="where">${esc(v.where)}</div></div>
      <div style="margin-left:auto;display:flex;gap:6px;align-items:center">
        <span class="tag">${nameOf(v.agent).split(' ')[0]}</span>
        <button class="btn ghost sm" onclick="toast('Reminder SMS sent to ${esc(v.who)}')">Remind</button>
      </div></div>`).join('')}
  </div>`;
}

/* ═══════════════════════════════════════════════════════════
   LEAD DRAWER — permissions differ by role
   ═══════════════════════════════════════════════════════════ */
function openLead(id){
  const l=leads.find(x=>x.id===id); if(!l)return;
  const canEdit = role!=='director' && (role==='manager'||l.agent===me);
  $('#drEyebrow').textContent=`${l.id} · ${l.source}${l.agent?' · '+nameOf(l.agent):' · unassigned'}`;
  $('#drName').textContent=l.name;
  $('#drMeta').textContent=`${l.phone} · ${money(l.budget)} · ${l.loc}`;
  const matches=properties.filter(p=>p.status!=='Sold'&&p.price<=l.budget*1.1&&p.price>=l.budget*0.6&&(p.loc===l.loc||p.bhk===l.bhk)).slice(0,4);
  const ap=approvals.find(a=>a.leadId===l.id&&a.status==='pending');

  $('#drBody').innerHTML=`
    ${canEdit?`<div class="dr-sec"><h4>Stage</h4>
      <div class="stage-pick">${STAGES.map(s=>`<button class="${l.stage===s.id?'on':''}" onclick="moveLead('${l.id}','${s.id}');openLead('${l.id}')">${s.label}</button>`).join('')}</div></div>`
    :`<div class="dr-sec"><h4>Stage</h4><div class="locked"><b>${stageLabel(l.stage)}</b>${role==='director'?'Board access is read-only. Stage changes belong to the deal owner.':'This lead belongs to '+nameOf(l.agent)+'.'}</div></div>`}

    ${ap?`<div class="dr-sec"><h4>Open approval</h4>
      <div class="qitem" style="margin:0"><div class="stampcol sky"></div>
      <div class="body"><div class="t" style="font-size:13px">${ap.id} · ${money(ap.offer)}</div>
      <div class="s">Raised ${ap.w} — waiting on ${nameOf('RK')}</div></div>
      ${role==='manager'?`<div class="acts"><button class="btn danger sm" onclick="decide('${ap.id}','rejected');openLead('${l.id}')">Reject</button><button class="btn brass sm" onclick="decide('${ap.id}','approved');openLead('${l.id}')">Approve</button></div>`:''}
      </div></div>`:''}

    <div class="dr-sec"><h4>Requirement</h4>
      <dl class="kv">
        <dt>Budget</dt><dd class="mono">${money(l.budget)}</dd>
        <dt>Locality</dt><dd>${esc(l.loc)}</dd>
        <dt>Config</dt><dd>${l.bhk?l.bhk+' BHK':'Plot'}</dd>
        <dt>Temperature</dt><dd><span class="tag ${l.temp==='hot'?'hot':l.temp==='warm'?'warm':''}">${l.temp}</span></dd>
        <dt>Next action</dt><dd>${esc(l.next)}</dd>
      </dl></div>

    <div class="dr-sec"><h4>Matched inventory — ${matches.length}</h4>
      ${matches.length?matches.map(p=>`<div class="match">
        <div class="sq">${p.bhk?p.bhk+'B':'PLT'}</div>
        <div><div class="t">${esc(p.title)}</div><div class="s">${esc(p.loc)} · ${p.sqft} sqft · ${p.status}</div></div>
        <div class="p mono">${money(p.price)}</div></div>`).join('')
      :'<div style="font-size:12.5px;color:var(--stone)">Nothing in inventory fits this budget and locality yet.</div>'}</div>

    ${canEdit&&l.stage==='nego'&&!ap?`<div class="dr-sec"><h4>Price</h4>
      <button class="btn ghost sm" onclick="askApproval('${l.id}')">Request discount approval</button>
      <div style="font-size:11.5px;color:var(--stone);margin-top:7px">Anything below list price needs your manager's sign-off before you can close.</div></div>`:''}

    ${canEdit?`<div class="dr-sec"><h4>Log an interaction</h4>
      <div class="logbox"><input id="logInput" placeholder="e.g. Called — wants east-facing only" onkeydown="if(event.key==='Enter')addLog('${l.id}')">
      <button class="btn brass sm" onclick="addLog('${l.id}')">Log</button></div></div>`:''}

    <div class="dr-sec"><h4>History</h4>
      <div class="tl">${l.log.map(e=>`<div class="e"><div class="txt">${esc(e.t)}</div><div class="w">${e.w}</div></div>`).join('')}</div></div>`;
  $('#scrim').classList.add('on'); $('#drawer').classList.add('on');
}
function addLog(id){
  const inp=$('#logInput'), val=inp.value.trim(); if(!val){inp.focus();return}
  const l=leads.find(x=>x.id===id);
  l.log.unshift({t:val,w:'just now'}); activity.push({t:`${l.name}: ${val}`,w:'now'});
  openLead(id); render(); toast('Interaction logged');
}
let apSeq=9;
function askApproval(leadId){
  const l=leads.find(x=>x.id===leadId);
  const p=properties.find(x=>x.status!=='Sold'&&(x.loc===l.loc||x.bhk===l.bhk))||properties[0];
  $('#modalTitle').textContent='Request discount approval';
  $('#modalBody').innerHTML=`
    <div class="f"><label>Lead</label><input value="${esc(l.name)} — ${l.id}" disabled></div>
    <div class="f"><label>Property</label><select id="apProp">${properties.filter(x=>x.status!=='Sold').map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${x.title} — ${money(x.price)}</option>`).join('')}</select></div>
    <div class="f"><label>Offer price (₹ lakhs)</label><input id="apOffer" type="number" placeholder="${Math.round(p.price/100000*0.96)}"></div>
    <div class="f"><label>Why should we accept?</label><input id="apNote" placeholder="e.g. loan-ready, closing in 10 days"></div>`;
  $('#modalSave').textContent='Send to manager';
  $('#modalSave').onclick=()=>{
    const prop=properties.find(x=>x.id=== $('#apProp').value);
    const offer=parseFloat($('#apOffer').value)*100000;
    if(!offer){toast('Enter an offer price');return}
    if(offer>=prop.price){toast('That\'s at or above list price — no approval needed');return}
    const a={id:'AP-'+(++apSeq),leadId,propId:prop.id,agent:me,list:prop.price,offer,status:'pending',note:$('#apNote').value.trim()||'—',w:'just now'};
    approvals.unshift(a);
    l.log.unshift({t:`Discount approval ${a.id} requested — ${money(offer)}`,w:'just now'});
    l.next='Awaiting discount approval';
    activity.push({t:`${nameOf(me)} raised ${a.id}`,w:'now'});
    closeAll(); renderNav(); render();
    toast(`<b>${a.id}</b> sent to ${nameOf('RK')} — switch to Manager to decide`);
  };
  $('#scrim').classList.add('on'); $('#modal').classList.add('on');
  setTimeout(()=>$('#apOffer').focus(),120);
}

/* ---------- add lead ---------- */
function openNewLead(){
  $('#modalTitle').textContent='Add lead';
  $('#modalBody').innerHTML=`
    <div class="f"><label>Full name</label><input id="nlName" placeholder="e.g. Divya Ramesh"></div>
    <div class="two"><div class="f"><label>Phone</label><input id="nlPhone" placeholder="+91 …"></div>
    <div class="f"><label>Budget (₹ lakhs)</label><input id="nlBudget" type="number" placeholder="120"></div></div>
    <div class="two"><div class="f"><label>Locality</label><select id="nlLoc">${LOCALITIES.map(l=>`<option>${l}</option>`).join('')}</select></div>
    <div class="f"><label>Config</label><select id="nlBhk"><option value="1">1 BHK</option><option value="2">2 BHK</option><option value="3" selected>3 BHK</option><option value="4">4 BHK</option><option value="0">Plot</option></select></div></div>
    <div class="two"><div class="f"><label>Source</label><select id="nlSrc"><option>Walk-in</option><option>Referral</option><option>Website</option><option>99acres</option><option>MagicBricks</option><option>Instagram</option></select></div>
    <div class="f"><label>Owner</label><select id="nlAgent">${role==='agent'?`<option value="${me}">${PEOPLE[me].name}</option>`:`<option value="">Leave unassigned</option>`+AGENT_IDS.map(k=>`<option value="${k}">${PEOPLE[k].name}</option>`).join('')}</select></div></div>`;
  $('#modalSave').textContent='Save lead';
  $('#modalSave').onclick=()=>{
    const name=$('#nlName').value.trim(), b=parseFloat($('#nlBudget').value);
    if(!name||!b){toast('Name and budget are required');return}
    addLead({name,phone:$('#nlPhone').value.trim()||'—',budget:b*100000,loc:$('#nlLoc').value,bhk:parseInt($('#nlBhk').value),source:$('#nlSrc').value,agent:$('#nlAgent').value});
    closeAll();
  };
  $('#scrim').classList.add('on'); $('#modal').classList.add('on');
  setTimeout(()=>$('#nlName').focus(),120);
}
let seq=1054;
function addLead(o){
  const l={id:'L-'+(++seq),stage:'new',temp:'warm',next:o.agent?'First call pending':'Unassigned',log:[{t:`Lead created via ${o.source}`,w:'just now'}],...o};
  leads.unshift(l);
  if(o.agent)tasks.push({id:Date.now(),agent:o.agent,t:`Call ${l.name} — first contact`,s:`${l.id} · new lead`,when:'Today',done:false});
  activity.push({t:`New lead: ${l.name} (${l.source})`,w:'now'});
  renderNav(); render();
  toast(`<b>${esc(l.name)}</b> added${o.agent?' for '+nameOf(o.agent):' to the assignment queue'}`);
  return l;
}

/* ---------- website ---------- */
function vSite(){
  let arr=properties.filter(p=>p.status==='Available').filter(p=>{
    if(siteFilter.loc&&p.loc!==siteFilter.loc)return false;
    if(siteFilter.bhk&&String(p.bhk)!==siteFilter.bhk)return false;
    if(siteFilter.max&&p.price>parseFloat(siteFilter.max)*10000000)return false;
    return true;
  });
  return `<div class="site-wrap">
    <div class="site-bar"><div class="dots"><i></i><i></i><i></i></div><div class="url">meridianestates.in</div>
      <div class="hint">Enquiries land in the manager's assignment queue — try it</div></div>
    <section class="hero"><div class="in">
      <div class="eyebrow">Chennai property, since 2011</div>
      <h2>Find the address you'll keep for thirty years.</h2>
      <p>Verified listings across Adyar, Besant Nagar, OMR and Anna Nagar — every one visited by our team before it goes live.</p>
      <div class="hsearch">
        <select onchange="siteFilter.loc=this.value;render()"><option value="">Any locality</option>${LOCALITIES.map(l=>`<option ${siteFilter.loc===l?'selected':''}>${l}</option>`).join('')}</select>
        <select onchange="siteFilter.bhk=this.value;render()"><option value="">Any size</option>${[1,2,3,4].map(n=>`<option value="${n}" ${siteFilter.bhk==String(n)?'selected':''}>${n} BHK</option>`).join('')}<option value="0" ${siteFilter.bhk==='0'?'selected':''}>Plot</option></select>
        <input type="number" step="0.5" placeholder="Max ₹ Cr" value="${siteFilter.max}" onchange="siteFilter.max=this.value;render()">
      </div></div></section>

    <section class="site-sec">
      <div class="eyebrow">Available now</div>
      <h3>${arr.length} ${arr.length===1?'property':'properties'} open for viewing</h3>
      <p class="lede">Pulled live from the same inventory your agents work from — mark something Sold in the CRM and it disappears here.</p>
      ${arr.length?`<div class="props">${arr.slice(0,8).map(p=>`<article class="prop">
        <div class="img"><span class="glyph">${p.facing} facing · ${p.sqft} sqft</span></div>
        <div class="bd"><div class="t">${esc(p.title)}</div><div class="loc">${esc(p.loc)}</div>
        <div class="pr mono">${money(p.price)}</div>
        <div class="meta"><span class="tag">${p.bhk?p.bhk+' BHK':'Plot'}</span><span class="tag">${p.type}</span></div>
        <div class="row"><button class="btn ghost sm" style="width:100%" onclick="siteEnquire('${p.id}')">Request a visit</button></div>
        </div></article>`).join('')}</div>`
      :`<div class="card empty"><b>No properties match that search</b>Try a different locality or raise the budget.</div>`}
    </section>

    <section class="site-sec">
      <div class="eyebrow">Tell us what you're looking for</div>
      <h3>We'll call you back within the hour.</h3>
      <p class="lede">Submit this, then switch to Manager — it's sitting in the assignment queue.</p>
      <div class="enq">
        <div class="f"><label>Your name</label><input id="wName" placeholder="Full name"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:11px">
          <div class="f"><label>Phone</label><input id="wPhone" placeholder="+91 …"></div>
          <div class="f"><label>Budget (₹ lakhs)</label><input id="wBudget" type="number" placeholder="150"></div></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:11px">
          <div class="f"><label>Preferred locality</label><select id="wLoc">${LOCALITIES.map(l=>`<option>${l}</option>`).join('')}</select></div>
          <div class="f"><label>Size</label><select id="wBhk"><option value="2">2 BHK</option><option value="3" selected>3 BHK</option><option value="4">4 BHK</option><option value="0">Plot</option></select></div></div>
        <button class="btn brass" style="justify-self:start" onclick="submitSiteEnquiry()">Send enquiry</button>
      </div>
    </section>
  </div>`;
}
function siteEnquire(pid){
  const p=properties.find(x=>x.id===pid);
  const l=addLead({name:'Visit request — '+p.title,phone:'—',budget:p.price,loc:p.loc,bhk:p.bhk,source:'Website',agent:''});
  toast(`Visit request logged as <b>${l.id}</b> — waiting for assignment`);
}
function submitSiteEnquiry(){
  const name=$('#wName').value.trim(), b=parseFloat($('#wBudget').value);
  if(!name||!b){toast('Add a name and budget to send the enquiry');return}
  const l=addLead({name,phone:$('#wPhone').value.trim()||'—',budget:b*100000,loc:$('#wLoc').value,bhk:parseInt($('#wBhk').value),source:'Website',agent:''});
  if(role==='manager')go('assign'); else toast(`Enquiry from <b>${esc(name)}</b> is now ${l.id} — switch to Manager to assign it`);
}

/* ---------- boot ---------- */
setRole('director');
</script>
</body>
</html>
